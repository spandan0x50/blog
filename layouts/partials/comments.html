<div class="comments">
    <script id="giscus-script"
            src="https://giscus.app/client.js"
            data-repo="spandan0x50/blog"
            data-repo-id="R_kgDOUOPzJw"
            data-category="Announcements"
            data-category-id="DIC_kwDOUOPzJ84DJYvP"
            data-mapping="pathname"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="bottom"
            data-theme="noborder_dark"
            data-lang="en"
            crossorigin="anonymous"
            async>
    </script>
</div>

<script>
    function getCurrentGiscusTheme() {
        const isDark = document.body.classList.contains("dark") || 
                       document.documentElement.getAttribute("data-theme") === "dark";
        return isDark ? "noborder_dark" : "light";
    }

    function syncGiscusTheme() {
        const iframe = document.querySelector('iframe.giscus-frame');
        if (!iframe) return;
        
        iframe.contentWindow.postMessage({
            giscus: {
                setConfig: {
                    theme: getCurrentGiscusTheme()
                }
            }
        }, 'https://giscus.app');
    }

    const currentTheme = getCurrentGiscusTheme();
    document.getElementById('giscus-script').setAttribute('data-theme', currentTheme);

    // Sync theme when Giscus finishes loading
    window.addEventListener('message', (event) => {
        if (event.origin === 'https://giscus.app') {
            syncGiscusTheme();
        }
    });

    document.addEventListener("DOMContentLoaded", () => {
        const themeToggle = document.getElementById("theme-toggle");
        if (themeToggle) {
            themeToggle.addEventListener("click", () => {
                setTimeout(syncGiscusTheme, 150);
            });
        }
    });

    const observer = new MutationObserver(() => {
        syncGiscusTheme();
    });
    observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
</script>
